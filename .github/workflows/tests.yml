name: Framework tests

on:
  push:
    paths:
      - "framework/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "framework/**"
      - ".github/workflows/tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install betat-community (dev extra)
        run: pip install -e "./framework[dev]"

      - name: Run pytest
        working-directory: framework
        run: pytest tests/
